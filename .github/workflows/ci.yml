name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen xcbeautify

      # The project file is generated, so regenerate it rather than trusting
      # whatever happens to be committed.
      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Paint.xcodeproj \
            -scheme Paint \
            -configuration Debug \
            -destination 'platform=macOS' \
            | xcbeautify --renderer github-actions

      - name: Release build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Paint.xcodeproj \
            -scheme Paint \
            -configuration Release \
            -destination 'platform=macOS' \
            | xcbeautify --renderer github-actions
